<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

    

                    let empleado = "";
                    let listado = " ";
                    let cantidad = 0;

                    while (empleado.toLowerCase() !== "salir") {
                        empleado = prompt("Ingresá nombre del empleado (o 'salir'): ");
                    if (empleado.toLowerCase() !== "salir"){
                        cantidad++;
                    listado += empleado + "\n";
                }
            }

                    alert("Se registraron " + cantidad + " empleados.");
                    alert(listado);

        
    </script>
</body>
</html>
