<body>

    <input type="number" placeholder="inngrese el sotck disponible" id="stock">
    <input type="number" placeholder="Cantidad vendida hoy" id="cantidad">
    <button onclick="funcion()">Calcular</button>
    <h6>
        Control de stock con alerta de reposición - Correcion
    </h6>

    <script>
        function funcion() {

            let stock = parseInt(document.getElementByd("stock").value)
            let ventas = parseInt(document.get("venta").value)
            let sockRestante = stock - ventas;

            if (stockRestante >= 0 && stockRestante <= 5) {
                alert(" Quedan solo " + stockRestante + " unidades. Reponer inventario urgente.");
            } else if (stockRestante < 0) {
                alert("No hay stock,las ventas superan al stock")
            } else {
                alert("Stock suficiente. Restan " + stockRestante + " unidades.");
            }

        }

    </script>
