<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h6>

        <h6>el usuario quiere agregar los nombres de los empleados y que el sistema muestre quienes cumplen la meta y
            quienes no </h6>
        <script>


            let meta = parseInt(prompt("Meta mensual:"));
            let totalCumplen = 0;
            let Metanocumple = 0;


            for (let i = 1; i <= 5; i++) {
                let ventas = parseInt(prompt("Ventas del empleado " + i));
                if (ventas >= meta) totalCumplen++;
                else if (ventas < meta) Metanocumple++;
            }

            alert("Empleados que cumplieron la meta: " + totalCumplen);
            alert("Empleados que no cumplieron la meta: " + Metanocumple);

        </script>
</body>

</html>
