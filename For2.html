<!DOCTYPE html>
<html lang="en">
<head>

<body>
    
<h6>Calcular el total de ventas de 5 días -Correcion</h6>


    <script>
        let total = " ";
            for (let i = 1; i <=  i; i++) {
                let venta = parseFloat(("Ingresá la venta del día " + i + ":"));
                total += venta;
            }
            alert("Total vendido en 5 días: $" + total.toFixes(2));

    </script>
</body>
</html>
